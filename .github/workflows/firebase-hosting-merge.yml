name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOCALHUB_69FBE }}'
      - uses: google-github-actions/setup-gcloud@v3
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - name: Grant the owner Admin access
        run: node scripts/set-user-role.mjs
        env:
          ROLE_EMAIL: 'toonisra33@gmail.com'
          ROLE: admin
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOCALHUB_69FBE }}'
          channelId: live
          projectId: localhub-69fbe
          target: atomy
