name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOCALHUB_69FBE }}'
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure Firebase App Check
        shell: bash
        run: |
          set -euo pipefail

          gcloud services enable \
            recaptchaenterprise.googleapis.com \
            firebaseappcheck.googleapis.com \
            --project=localhub-69fbe

          key_name="$(gcloud recaptcha keys list \
            --project=localhub-69fbe \
            --filter='displayName="Atomy Funnel Web"' \
            --format='value(name)' \
            --limit=1)"

          if [ -z "$key_name" ]; then
            key_name="$(gcloud recaptcha keys create \
              --project=localhub-69fbe \
              --display-name='Atomy Funnel Web' \
              --web \
              --domains=localhub-atomy.web.app,localhub-atomy.firebaseapp.com \
              --integration-type=score \
              --format='value(name)')"
          fi

          site_key="${key_name##*/}"
          access_token="$(gcloud auth print-access-token)"

          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer ${access_token}" \
            --header 'Content-Type: application/json' \
            --data "{\"name\":\"projects/284105273690/apps/1:284105273690:web:6e8431f25f0f168b430363/recaptchaEnterpriseConfig\",\"siteKey\":\"${site_key}\"}" \
            'https://firebaseappcheck.googleapis.com/v1/projects/284105273690/apps/1:284105273690:web:6e8431f25f0f168b430363/recaptchaEnterpriseConfig?updateMask=siteKey'

          echo "VITE_RECAPTCHA_ENTERPRISE_SITE_KEY=${site_key}" >> "$GITHUB_ENV"
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - name: Grant the owner Admin access
        run: node scripts/set-user-role.mjs
        env:
          ROLE_EMAIL: 'toonisra33@gmail.com'
          ROLE: admin
      - run: npx --yes firebase-tools deploy --only firestore:rules --project localhub-69fbe --non-interactive
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOCALHUB_69FBE }}'
          channelId: live
          projectId: localhub-69fbe
          target: atomy
      - name: Enforce App Check for Cloud Firestore
        shell: bash
        run: |
          set -euo pipefail
          access_token="$(gcloud auth print-access-token)"
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer ${access_token}" \
            --header 'Content-Type: application/json' \
            --data '{"name":"projects/284105273690/services/firestore.googleapis.com","enforcementMode":"ENFORCED"}' \
            'https://firebaseappcheck.googleapis.com/v1/projects/284105273690/services/firestore.googleapis.com?updateMask=enforcementMode'
