<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="ระบบเรียนรู้ออนไลน์ ดูฟรี 15 นาที พร้อมที่ปรึกษาคอยดูแล" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Atomy Business Opportunity" />
    <meta property="og:title" content="โอกาสสร้างรายได้เสริมควบคู่กับงานประจำ/และโอกาสที่แสนเรียบง่าย" />
    <meta property="og:description" content="ระบบเรียนรู้ออนไลน์ ดูฟรี 15 นาที พร้อมที่ปรึกษาคอยดูแล" />
    <!-- Social Sharing Cards: Desktop (1200x630) & Mobile (1080x720) -->
    <meta property="og:image" id="og-image-tag" content="https://sponsor-atomy.web.app/og-image.jpg" />
    <meta property="og:image:secure_url" id="og-image-secure-tag" content="https://sponsor-atomy.web.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" id="og-image-width-tag" content="1200" />
    <meta property="og:image:height" id="og-image-height-tag" content="630" />
    <meta property="og:image:alt" content="โอกาสสร้างรายได้เสริมควบคู่กับงานประจำ/และโอกาสที่แสนเรียบง่าย" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="โอกาสสร้างรายได้เสริมควบคู่กับงานประจำ/และโอกาสที่แสนเรียบง่าย" />
    <meta name="twitter:description" content="ระบบเรียนรู้ออนไลน์ ดูฟรี 15 นาที พร้อมที่ปรึกษาคอยดูแล" />
    <meta name="twitter:image" id="twitter-image-tag" content="https://sponsor-atomy.web.app/og-image.jpg" />

    <!-- Automatic Device Detection for Social & Browser Links -->
    <script>
      (function() {
        try {
          var ua = navigator.userAgent || '';
          var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|mobile/i.test(ua) || (window.innerWidth && window.innerWidth < 768);
          if (isMobile) {
            var ogImg = document.getElementById('og-image-tag');
            if (ogImg) ogImg.setAttribute('content', 'https://sponsor-atomy.web.app/og-image-mobile.jpg');
            var ogImgSec = document.getElementById('og-image-secure-tag');
            if (ogImgSec) ogImgSec.setAttribute('content', 'https://sponsor-atomy.web.app/og-image-mobile.jpg');
            var ogW = document.getElementById('og-image-width-tag');
            if (ogW) ogW.setAttribute('content', '1080');
            var ogH = document.getElementById('og-image-height-tag');
            if (ogH) ogH.setAttribute('content', '720');
            var twImg = document.getElementById('twitter-image-tag');
            if (twImg) twImg.setAttribute('content', 'https://sponsor-atomy.web.app/og-image-mobile.jpg');
          }
        } catch(e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
